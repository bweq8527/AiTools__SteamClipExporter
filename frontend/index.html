<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 录像转换器</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="video-overlay" class="overlay" onclick="closePlayer()">
        <div class="player-container" onclick="event.stopPropagation()">
            <video id="main-player" controls autoplay></video>
            <div class="player-info">
                <span id="player-title">正在播放</span>
                <button onclick="closePlayer()">关闭</button>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="log-sidebar">
            <div class="log-item">
                <div class="log-name front-color">[FRONTEND_LOG]</div>
                <div id="l-front" class="terminal"></div>
            </div>
            <div class="log-item">
                <div class="log-name ffmpeg-color">[FFMPEG_LOG]</div>
                <div id="l-ffmpeg" class="terminal"></div>
            </div>
            <div class="log-item">
                <div class="log-name py-color">[BCAKEND_LOG]</div>
                <div id="l-py" class="terminal"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="box path-box" style="gap: 10px;">
                <div class="path-group">
                    <input type="text" id="p" placeholder="请选择或输入素材库路径...">
                    <button style="background:#454545" onclick="browse('p')">选择素材目录</button>
                    <button onclick="setP()">扫描素材库文件夹</button>
                </div>
                <div class="path-group">
                    <input type="text" id="ep" onchange="setExportPath()" placeholder="请选择或输入导出库路径（默认导出至素材库）...">
                    <button style="background:#454545" onclick="browse('ep')">选择导出目录</button>
                    <button style="background:#2e7d32" onclick="openExportDir()">打开导出库文件夹</button>
                </div>
                <p id="msg" style="color:#4caf50; margin-top: 5px; font-size: 13px;"></p>
            </div>
            
            <div class="bottom-grid">
                <div class="box">
                    <div style="display:flex; justify-content: space-between; align-items: center;">
                        <div style="display:flex; align-items: center; gap: 10px;">
                            <span id="lib-title" style="font-weight: bold;">待处理素材库</span>
                            <button id="viewBtn" style="background:#555; padding: 4px 10px; font-size: 11px;" onclick="toggleView()">视图: 全部平铺</button>
                            <button id="allBtn" style="background:#006064; padding: 4px 10px; font-size: 11px;" onclick="selectAll()">全选未导出</button>
                        </div>
                        <button id="qBtn" onclick="addQ()" disabled>批量转换所选素材</button>
                    </div>
                    <div class="scroll-area">
                        <div id="list" class="list"></div>
                    </div>
                </div>
                
                <div class="box task-box">
                    <span style="font-weight: bold;">转换任务进度</span>
                    <div id="monitor-panel" class="task-monitor">
                        <div class="monitor-header">
                            <div class="monitor-caption"><span class="monitor-dot"></span><span id="monitor-state">等待导出任务</span></div>
                            <button id="monitor-follow" type="button" title="自动显示正在执行的任务">跟随当前</button>
                        </div>
                        <div id="monitor-task" class="monitor-task">等待导出任务</div>
                        <div class="monitor-metrics">
                            <div><span class="metric-label">文件写入速度</span><strong id="monitor-disk">— MB/s</strong></div>
                            <div><span id="monitor-speed-label" class="metric-label">视频片段处理速度</span><strong id="monitor-speed">— 个/s</strong></div>
                            <div><span class="metric-label">总用时</span><strong id="monitor-time">00:00</strong></div>
                        </div>
                        <div class="monitor-canvas">
                            <div class="monitor-plot-label"><span>写入 MB/s ↑</span><span>片段 个/s／封装 x ↓</span></div>
                            <div class="monitor-plot monitor-bars"><canvas id="chart" aria-label="文件写入速度，固定宽度柱形"></canvas></div>
                            <div class="monitor-plot monitor-lines"><canvas id="speed-chart" aria-label="处理速度，数值从上向下增大"></canvas></div>
                            <div id="monitor-empty" class="monitor-empty">等待任务采样数据</div>
                        </div>
                        <div id="monitor-phases" class="monitor-phases"></div>
                        <div class="monitor-note">上方固定细柱：写入 MB/s · 下方折线：片段 个/s／封装 x，向下数值增大<br>两图共用处理时间，省略等待，总用时仍含等待；采样按时间窗口显示均值，写入可能含缓存。阶段按钮放大／返回全程，任务条切换</div>
                    </div>
                    <div class="scroll-area" id="qList"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
